[package]
name = "zenith-language"
version = "1.3.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
serde_json = "=1.0.154"
cranelift-codegen = { version = "=0.136.1", default-features = false, features = ["std", "unwind", "x86"] }
cranelift-frontend = "=0.136.1"
cranelift-module = "=0.136.1"
cranelift-object = "=0.136.1"
object = { version = "=0.40.0", default-features = false, features = ["write", "std", "coff"] }

[[bin]]
name = "zn"
path = "src/main.rs"

[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = 1
debug = 0
strip = "symbols"
incremental = false

