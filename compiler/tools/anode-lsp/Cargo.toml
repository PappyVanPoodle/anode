[package]
name = "anode-lsp"
version = "1.3.0"
edition = "2021"
publish = false
description = "Language Server Protocol integration for the Anode programming language"

[workspace]

[dependencies]
serde_json = "=1.0.154"

[[bin]]
name = "anode-lsp"
path = "src/main.rs"

[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = 1
debug = 0
strip = "symbols"
incremental = false
