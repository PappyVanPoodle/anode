<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
  <title id="title">ANODE 1.3</title>
  <desc id="desc">Systems programming without lifetime noise. Built for humans and AI agents. Zero lifetime annotations, @effect capabilities, 23 ms check and sub-0.3 s test loop, AGENTS.md built into anode new.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="0.55" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0a0d18"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.62" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridFade" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="1200" height="360" fill="url(#gridFade)"/>
    </mask>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .sans { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; }
      .pill-text { font-size: 15px; fill: #dbeafe; }
      .pill-code { fill: #67e8f9; }
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)" mask="url(#gridMask)"/>
  <circle cx="170" cy="120" r="230" fill="url(#glowCyan)"/>
  <circle cx="1060" cy="40" r="260" fill="url(#glowViolet)"/>
  <circle cx="760" cy="380" r="220" fill="url(#glowCyan)" opacity="0.5"/>

  <!-- Emblem: a hexagonal cell around a diode mark (anode triangle meeting its bar) -->
  <g transform="translate(160 132)">
    <polygon points="0,-92 79.7,-46 79.7,46 0,92 -79.7,46 -79.7,-46" fill="#0b1224" fill-opacity="0.85" stroke="url(#accent)" stroke-width="3" filter="url(#soft)"/>
    <polygon points="0,-70 60.6,-35 60.6,35 0,70 -60.6,35 -60.6,-35" fill="none" stroke="#60a5fa" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="-58" y1="0" x2="-30" y2="0" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/>
    <polygon points="-30,-30 22,0 -30,30" fill="url(#accent)" filter="url(#soft)"/>
    <line x1="24" y1="-32" x2="24" y2="32" stroke="#e0f2fe" stroke-width="6" stroke-linecap="round"/>
    <line x1="24" y1="0" x2="56" y2="0" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-92" r="4" fill="#22d3ee"/>
    <circle cx="79.7" cy="46" r="4" fill="#60a5fa"/>
    <circle cx="-79.7" cy="46" r="4" fill="#a78bfa"/>
  </g>

  <!-- Wordmark -->
  <text x="282" y="128" class="sans" font-size="84" font-weight="800" letter-spacing="6" fill="url(#titleFill)">ANODE <tspan fill="url(#accent)">1.3</tspan></text>
  <text x="286" y="174" class="sans" font-size="22" fill="#b6c2d6">Systems programming without lifetime noise. Built for humans and AI agents.</text>
  <text x="287" y="208" class="mono" font-size="14" fill="#64748b" letter-spacing="1">v1.3.0  ·  Windows x64  ·  native Cranelift + C/MSVC  ·  8 pure-.an stdlib packages</text>

  <rect x="60" y="236" width="1080" height="1.5" fill="url(#rule)"/>

  <!-- Callouts -->
  <g class="sans">
    <g transform="translate(67 262)">
      <rect width="255" height="46" rx="23" fill="#0f172a" fill-opacity="0.8" stroke="#22d3ee" stroke-opacity="0.55"/>
      <circle cx="24" cy="23" r="5" fill="#22d3ee"/>
      <text x="138" y="28.5" text-anchor="middle" class="pill-text">Zero Lifetime Annotations</text>
    </g>
    <g transform="translate(337 262)">
      <rect width="255" height="46" rx="23" fill="#0f172a" fill-opacity="0.8" stroke="#60a5fa" stroke-opacity="0.55"/>
      <circle cx="24" cy="23" r="5" fill="#60a5fa"/>
      <text x="138" y="28.5" text-anchor="middle" class="pill-text"><tspan class="mono pill-code">@effect(...)</tspan> Capabilities</text>
    </g>
    <g transform="translate(607 262)">
      <rect width="255" height="46" rx="23" fill="#0f172a" fill-opacity="0.8" stroke="#818cf8" stroke-opacity="0.55"/>
      <circle cx="24" cy="23" r="5" fill="#818cf8"/>
      <text x="138" y="28.5" text-anchor="middle" class="pill-text">23 ms Check · &lt;0.3 s Tests</text>
    </g>
    <g transform="translate(877 262)">
      <rect width="255" height="46" rx="23" fill="#0f172a" fill-opacity="0.8" stroke="#a78bfa" stroke-opacity="0.55"/>
      <circle cx="24" cy="23" r="5" fill="#a78bfa"/>
      <text x="138" y="28.5" text-anchor="middle" class="pill-text"><tspan class="mono pill-code">AGENTS.md</tspan> in <tspan class="mono pill-code">anode new</tspan></text>
    </g>
  </g>
</svg>
